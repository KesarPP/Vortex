name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID || 'team_uRT2NbySmNEXbVb4SH59jNtg' }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID || 'prj_UNqK4zLb2w5BZzHLwIK8CHk5qSu3' }}
          vercel-args: '--prod'
          working-directory: './build/web'
